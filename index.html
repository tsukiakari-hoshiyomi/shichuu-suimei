<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四柱推命 命式計算</title>
<style>
  :root {
    --bg-top: #060810;
    --bg-bottom: #000103;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-border: rgba(230, 220, 200, 0.18);
    --ink: #efe7d6;
    --sub: #93a0b8;
    --accent: #d8b077;
    --accent-soft: rgba(216, 176, 119, 0.14);
    --border: rgba(230, 220, 200, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif, "Hiragino Kaku Gothic ProN", sans-serif;
    color: var(--ink);
    line-height: 1.7;
    background: radial-gradient(ellipse at 18% 18%, #0d1424 0%, transparent 45%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    position: relative;
    overflow-x: hidden;
  }

  /* 星空 */
  .stars, .stars::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background-repeat: repeat;
    background-image:
      radial-gradient(1.6px 1.6px at 20px 30px, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(1.2px 1.2px at 90px 120px, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1px 1px at 160px 40px, rgba(255,255,255,0.55), transparent 60%),
      radial-gradient(1.4px 1.4px at 230px 170px, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(1px 1px at 60px 200px, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1.2px 1.2px at 280px 90px, rgba(255,255,255,0.65), transparent 60%),
      radial-gradient(1px 1px at 130px 260px, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1.6px 1.6px at 300px 250px, rgba(255,255,255,0.85), transparent 60%),
      radial-gradient(1px 1px at 10px 280px, rgba(255,255,255,0.45), transparent 60%);
    background-size: 320px 320px;
  }
  .stars::after {
    background-position: 160px 160px;
    opacity: 0.6;
  }

  /* 月 */
  .moon {
    position: fixed;
    top: 8%;
    left: 10%;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #ffffff 0%, #eef1f6 35%, #cfd6e4 70%, #b9c2d6 100%);
    box-shadow: 0 0 60px 18px rgba(230, 236, 255, 0.35), 0 0 120px 50px rgba(200, 210, 245, 0.12);
    z-index: -1;
    pointer-events: none;
  }
  @media (max-width: 640px) {
    .moon { width: 80px; height: 80px; top: 5%; left: 8%; }
  }

  header {
    text-align: center;
    padding: 4rem 1rem 2rem;
  }
  header h1 {
    margin: 0;
    font-size: 2.6rem;
    letter-spacing: 0.5em;
    padding-left: 0.5em; /* 字送り分を中央に補正 */
    font-weight: 500;
    color: var(--ink);
    text-shadow: 0 0 30px rgba(239, 231, 214, 0.25);
  }
  header .sub {
    margin: 1rem 0 0;
    font-size: 0.95rem;
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    color: var(--sub);
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 1rem 4rem;
    position: relative;
  }

  form.input-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 1.8rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  .field { display: flex; flex-direction: column; gap: 0.4rem; }
  .field label {
    font-size: 0.75rem;
    color: var(--sub);
    letter-spacing: 0.1em;
  }
  .field input[type="date"], .field select {
    font-size: 1rem;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    color: var(--ink);
    font-family: inherit;
    color-scheme: dark;
  }
  .sex-group { display: flex; gap: 0.6rem; }
  .sex-group label {
    display: flex; align-items: center; gap: 0.35rem;
    font-size: 0.9rem; padding: 0.55rem 0.9rem;
    border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; user-select: none;
    color: var(--ink);
  }
  .sex-group input { accent-color: var(--accent); }
  button[type="submit"] {
    font-size: 0.95rem;
    letter-spacing: 0.1em;
    padding: 0.65rem 1.8rem;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, color 0.2s;
  }
  button[type="submit"]:hover {
    background: var(--accent);
    color: #12100a;
  }

  #error {
    margin: 1.2rem auto 0;
    color: #e2a5a5;
    font-size: 0.85rem;
    text-align: center;
    display: none;
  }

  #result {
    display: none;
    margin-top: 2.2rem;
  }

  .meishiki-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 1.6rem;
    backdrop-filter: blur(6px);
  }

  .table-wrap { overflow-x: auto; }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 1rem;
    min-width: 360px;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 0.85rem 0.7rem;
    text-align: center;
  }
  th {
    color: var(--sub);
    font-weight: 500;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    background: rgba(255,255,255,0.02);
  }
  td.head-col, th.head-col {
    color: var(--sub);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    background: rgba(255,255,255,0.02);
  }
  td.kanshi {
    font-size: 1.5rem;
    letter-spacing: 0.15em;
    color: var(--ink);
  }
  td.gogyou {
    color: var(--sub);
    font-size: 0.85rem;
  }

  .tenchu-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-top: 1.2rem;
  }
  .tenchu-item {
    flex: 1;
    min-width: 160px;
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 0.7rem 1rem;
    text-align: center;
  }
  .tenchu-item .label {
    color: var(--sub);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
  }
  .tenchu-item .value {
    margin-top: 0.25rem;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    color: var(--ink);
  }

  .daykanshi-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 1.8rem 1.5rem;
    margin-top: 1.4rem;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .daykanshi-big {
    font-size: 2.4rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(216, 176, 119, 0.35);
  }
  .daykanshi-big rt {
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    color: var(--sub);
    text-shadow: none;
  }
  .daykanshi-text {
    margin: 0.9rem 0 0;
    color: var(--ink);
    font-size: 0.95rem;
    line-height: 1.9;
    white-space: pre-line;
    text-align: center;
  }
  .note-link {
    display: inline-block;
    margin-top: 1.4rem;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 0.15rem;
  }
  .note-link:hover {
    opacity: 0.8;
  }

  .chusatsu-item {
    margin-top: 0.8rem;
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 0.7rem 1rem;
    text-align: center;
  }
  .chusatsu-item .label {
    color: var(--sub);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
  }
  .chusatsu-item .value {
    margin-top: 0.25rem;
    font-size: 1rem;
    letter-spacing: 0.05em;
    color: var(--ink);
  }

  footer {
    max-width: 640px;
    margin: 3rem auto 0;
    padding: 0 1rem;
    color: var(--sub);
    font-size: 0.72rem;
    text-align: center;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="moon"></div>

<header>
  <h1>月灯り</h1>
  <p class="sub">四柱推命 命式計算</p>
</header>

<main>
  <form class="input-card" id="form">
    <div class="field">
      <label for="birthdate">生年月日</label>
      <input type="date" id="birthdate" name="birthdate" min="1901-01-01" max="2100-12-31" value="1990-08-29" required>
    </div>
    <div class="field">
      <label>性別</label>
      <div class="sex-group">
        <label><input type="radio" name="sex" value="女" checked> 女性</label>
        <label><input type="radio" name="sex" value="男"> 男性</label>
      </div>
    </div>
    <button type="submit">計算する</button>
  </form>

  <div id="error"></div>

  <div id="result">
    <div class="meishiki-card">
      <div class="table-wrap">
        <table id="meishiki-table"></table>
      </div>
      <div class="tenchu-row" id="tenchu-row"></div>
      <div class="chusatsu-item" id="chusatsu-item"></div>
    </div>

    <div class="daykanshi-card">
      <div class="daykanshi-big" id="daykanshi-big"></div>
      <p class="daykanshi-text" id="daykanshi-text"></p>
      <a class="note-link" href="https://note.com/miiwa_uranai" target="_blank" rel="noopener noreferrer">詳細はこちらへ →</a>
    </div>
  </div>

  <footer>
    このアプリは <code>meishiki.js</code>（鳥海流・天象学会万年暦準拠の計算ロジック）を使用しています。時柱は含みません。節入り日は近似値のため、節入り前後の生年月日は結果が変わる場合があります。
  </footer>
</main>

<script type="module">
import { calcMeishiki, gogyouOfKan, gogyouOfShi, KAN_YOMI, SHI_YOMI } from './meishiki.js';
import { KANSHI_TEXT } from './kanshi-text.js';

const form = document.getElementById('form');
const errorBox = document.getElementById('error');
const resultBox = document.getElementById('result');

const goStr = (kan, shi) => {
  const a = gogyouOfKan(kan), b = gogyouOfShi(shi);
  return `${a.sign}${a.gogyou} / ${b.sign}${b.gogyou}`;
};

function renderMeishikiTable(r) {
  const rows = [
    ['', '日柱', '月柱', '年柱'],
    ['干支', r.dayKanshi, r.monthKanshi, r.yearKanshi],
    ['五行', goStr(r.dayKanshi[0], r.dayKanshi[1]), goStr(r.monthKanshi[0], r.monthKanshi[1]), goStr(r.yearKanshi[0], r.yearKanshi[1])],
  ];
  const table = document.getElementById('meishiki-table');
  table.innerHTML = '';
  rows.forEach((row, ri) => {
    const tr = document.createElement('tr');
    row.forEach((cell, ci) => {
      const el = document.createElement(ri === 0 ? 'th' : 'td');
      if (ci === 0) el.classList.add('head-col');
      if (ri === 1 && ci > 0) el.classList.add('kanshi');
      if (ri === 2 && ci > 0) el.classList.add('gogyou');
      el.textContent = cell;
      tr.appendChild(el);
    });
    table.appendChild(tr);
  });
}

function renderTenchuRow(r) {
  const row = document.getElementById('tenchu-row');
  row.innerHTML = `
    <div class="tenchu-item">
      <div class="label">天中殺（日柱）</div>
      <div class="value">${r.tenchu.day}</div>
    </div>
    <div class="tenchu-item">
      <div class="label">天中殺（年柱）</div>
      <div class="value">${r.tenchu.year}</div>
    </div>
  `;
}

function renderChusatsu(r) {
  const ch = r.chusatsu;
  const names = [];
  if (ch.seinichi) names.push('生日中殺');
  if (ch.seigetsu) names.push('生月中殺');
  if (ch.seinen) names.push('生年中殺');
  if (ch.hiza.year || ch.hiza.month || ch.hiza.day) names.push('日座中殺');

  const el = document.getElementById('chusatsu-item');
  el.innerHTML = `
    <div class="label">中殺</div>
    <div class="value">${names.length ? names.join('・') : 'なし'}</div>
  `;
}

function renderDayKanshi(r) {
  const yomi = KAN_YOMI[r.dayKanshi[0]] + SHI_YOMI[r.dayKanshi[1]];
  document.getElementById('daykanshi-big').innerHTML = `<ruby>${r.dayKanshi}<rt>${yomi}</rt></ruby>`;
  const text = KANSHI_TEXT[r.dayKanshi];
  document.getElementById('daykanshi-text').textContent = text || '（準備中）';
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  const dateVal = document.getElementById('birthdate').value;
  const sex = form.querySelector('input[name="sex"]:checked').value;

  if (!dateVal) {
    errorBox.textContent = '生年月日を入力してください。';
    errorBox.style.display = 'block';
    return;
  }
  const [y, m, d] = dateVal.split('-').map(Number);
  if (y < 1901 || y > 2100) {
    errorBox.textContent = '対応範囲は1901年〜2100年です。';
    errorBox.style.display = 'block';
    resultBox.style.display = 'none';
    return;
  }

  try {
    const r = calcMeishiki(y, m, d, sex);
    renderMeishikiTable(r);
    renderTenchuRow(r);
    renderChusatsu(r);
    renderDayKanshi(r);
    resultBox.style.display = 'block';
  } catch (err) {
    errorBox.textContent = `計算中にエラーが発生しました：${err.message}`;
    errorBox.style.display = 'block';
    resultBox.style.display = 'none';
  }
});

// 初期表示（デフォルト値で自動計算）
form.dispatchEvent(new Event('submit'));
</script>

</body>
</html>
